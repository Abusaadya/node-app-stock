version: '3.8'
services:
  salla-app:
    build: .
    container_name: salla-app
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: salla-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - salla-app

  db:
    image: postgres:15-alpine
    container_name: salla-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-test}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-test}
      POSTGRES_DB: ${DATABASE_NAME:-test}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
